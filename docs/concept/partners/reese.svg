  <rect x="300" y="232" width="26" height="40" rx="12" fill="#1a241d" stroke="#5fd07a" stroke-opacity="0.7"/>
  <path d="M302 268 Q280 300 250 300" stroke="#1a241d" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="250" cy="300" r="9" fill="#5fd07a" fill-opacity="0.85"/>

