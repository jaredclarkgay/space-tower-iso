  <path d="M282 416 L240 600 L322 600 L302 472 Z" fill="#1a241d"/>

  <rect x="212" y="322" width="56" height="78" rx="20" fill="#bf8058"/>
  <circle cx="160" cy="248" r="15" fill="#c98a64"/>
  <circle cx="320" cy="248" r="15" fill="#c98a64"/>
  <ellipse cx="240" cy="232" rx="78" ry="90" fill="#c98a64"/>

  <!-- short cropped hair -->
  <path d="M160 224 Q162 144 240 138 Q318 144 320 224 Q314 176 240 172 Q166 176 160 224 Z" fill="#241a12"/>
  <path d="M160 224 Q154 244 162 262 Q156 232 168 206 Z" fill="#241a12"/>
