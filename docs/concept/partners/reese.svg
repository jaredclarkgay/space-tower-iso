  </defs>
  <rect width="480" height="600" rx="28" fill="url(#bg)"/>
  <rect x="6" y="6" width="468" height="588" rx="24" fill="none" stroke="#5fd07a" stroke-opacity="0.35" stroke-width="2"/>

