    <rect x="338" y="440" width="44" height="86" rx="13" fill="#0e1a12" stroke="#5fd07a" stroke-opacity="0.5"/>
    <rect x="346" y="452" width="28" height="54" rx="6" fill="#16281c"/>
    <rect x="346" y="452" width="28" height="9" rx="4" fill="#5fd07a" fill-opacity="0.55"/>
